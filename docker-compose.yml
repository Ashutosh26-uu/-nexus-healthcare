# Production stack: app + PostgreSQL + Caddy (automatic HTTPS).
# 1. cp .env.production.example .env.production   and fill it in
# 2. set DOMAIN below (or in your shell) to your domain, pointed at this server
# 3. docker compose up -d --build
services:
  app:
    build: .
    restart: unless-stopped
    env_file: .env.production
    environment:
      DATABASE_URL: postgres://nexus:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD to a long random password}@db:5432/nexus
    volumes:
      - app-data:/app/server/data
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: nexus
      POSTGRES_DB: nexus
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD to a long random password}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nexus"]
      interval: 5s
      retries: 10

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports: ["80:80", "443:443"]
    command: caddy reverse-proxy --from ${DOMAIN:-localhost} --to app:8080
    volumes:
      - caddy-data:/data
    depends_on: [app]

volumes:
  app-data:
  db-data:
  caddy-data:
